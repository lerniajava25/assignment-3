<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyPet</title>
    <link rel="preload" href="fonts/KosugiMaru-Regular.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="fonts/RobotoMono-VariableFont_wght.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/find-pet.css">
    <link rel="stylesheet" href="css/game.css">

</head>
<body>

<!-- Startsidan -->
<section id="start">
    <h1>MyPet</h1>
    <div class="start__actions">
        <button type="button" class="btn-primary" id="open-game">Continue</button>
        <button type="button" class="btn-secondary" id="open-adopt">Adopt a pet</button>
    </div>
</section>

<!-- Overlay with filer options -->

<dialog id="find-pet" class="find-pet" aria-labelledby="find-title">
    <header class="find-pet__top">
        <button type="button" class="find-pet__back" id="find-back" aria-label="Back">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2"
                      stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>

        <h2 id="find-title">Find pet</h2>

        <label class="find-pet__search">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <circle cx="11" cy="11" r="7"/>
                    <path d="M20 20l-4-4"/>
                </g>
            </svg>
            <input type="search" id="find-search" placeholder="Enter pet name or species"
                   aria-label="Search pets by name or species" autocomplete="off" autofocus>
        </label>
    </header>

    <div class="find-pet__table-wrap">
        <table class="find-pet__table">
            <thead>
            <tr>
                <th scope="col" data-key="id" aria-sort="ascending"><button type="button" class="sort">ID</button></th>
                <th scope="col" data-key="name" aria-sort="none"><button type="button" class="sort">Name</button></th>
                <th scope="col" data-key="species" aria-sort="none"><button type="button" class="sort">Species</button></th>
                <th scope="col" data-key="hungerLevel" aria-sort="none"><button type="button" class="sort">Hunger Level</button></th>
                <th scope="col" data-key="happiness" aria-sort="none"><button type="button" class="sort">Happiness</button></th>
            </tr>
            </thead>
            <tbody id="find-rows"></tbody>
        </table>
    </div>

    <footer class="find-pet__pager">
        <button type="button" id="find-prev" aria-label="Previous page">&lt;</button>
        <span id="find-page" aria-live="polite">1/1</span>
        <button type="button" id="find-next" aria-label="Next page">&gt;</button>
    </footer>
</dialog>

<!-- "Spelkonsol" med djuret -->
<section id="game" class="game" hidden>
    <div class="tama">
        <div class="console">
            <h2 class="console__title">MyPet</h2>

            <div class="screen" id="screen">
                <p class="screen__name" id="pet-name"></p>
                <button type="button" class="screen__back" id="game-back" data-sprite="back"
                        aria-label="Back to start"></button>

                <div class="pet" id="pet" role="img" aria-label="Your pet"></div>

                <!-- Tryck eller dra till djuret -->
                <button type="button" class="item item--feed" data-action="feed" data-sprite="apple"
                        aria-label="Feed"></button>

                <button type="button" class="item item--play" data-action="play" data-sprite="ball"
                        aria-label="Play"></button>
            </div>

            <div class="controls">
                <button type="button" class="knob" id="btn-feed"><i></i>Feed</button>
                <button type="button" class="knob knob--mid" id="btn-play"><i></i>Play</button>
                <button type="button" class="knob" id="btn-release"><i></i>Release</button>
            </div>
        </div>
    </div>
</section>

<dialog id="release-dialog" class="confirm" aria-labelledby="release-title">
    <h2 id="release-title">Release <span id="release-name"></span>?</h2>
    <p>This can't be undone.</p>
    <div class="confirm__actions">
        <button type="button" id="release-cancel" class="confirm__cancel">Cancel</button>
        <button type="button" id="release-confirm" class="btn-primary">Release</button>
    </div>
</dialog>

<p id="toast" class="toast" role="status" hidden></p>

<script src="js/main.js"></script>
<script src="js/game.js"></script>
<script src="js/find-pet.js"></script>

</body>
</html>
